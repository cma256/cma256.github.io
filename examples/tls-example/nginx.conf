# TLS-terminating TCP proxy.
#
# Run from the project root (paths are relative to the prefix):
#   nginx -p "$PWD" -e logs/error.log -c nginx.conf
#
# Clients speak TLS to 127.0.0.1:8443; nginx decrypts and forwards
# plaintext bytes to the echo server on 127.0.0.1:9099.

worker_processes 1;
daemon off;
pid logs/nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 64;
}

stream {
    upstream echo_backend {
        server 127.0.0.1:9099;
    }

    server {
        listen 127.0.0.1:8443 ssl;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass echo_backend;
    }
}
